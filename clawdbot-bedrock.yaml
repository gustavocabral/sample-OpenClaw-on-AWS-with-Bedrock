AWSTemplateFormatVersion: '2010-09-09'
Description: 'OpenClaw - AWS Native Deployment (Bedrock + SSM + VPC Endpoints)'

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E6101
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Basic Configuration"
        Parameters:
          - OpenClawModel
          - InstanceType
          - KeyPairName
      - Label:
          default: "Network Configuration"
        Parameters:
          - CreateVPCEndpoints
          - AllowedSSHCIDR

Parameters:
  OpenClawModel:
    Type: String
    Default: "global.amazon.nova-2-lite-v1:0"
    Description: "Bedrock model ID - Nova 2 Lite offers best price-performance for everyday tasks"
    AllowedValues:
      - "global.amazon.nova-2-lite-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.amazon.nova-pro-v1:0"
      - "global.anthropic.claude-opus-4-6-v1"
      - "global.anthropic.claude-opus-4-5-20251101-v1:0"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-20250514-v1:0"
      - "us.deepseek.r1-v1:0"
      - "us.meta.llama3-3-70b-instruct-v1:0"
      - "moonshotai.kimi-k2.5"

  InstanceType:
    Type: String
    Default: "c7g.large"
    Description: "Graviton (ARM) recommended for 20-40% better price-performance. x86 also supported."
    AllowedValues:
      - "t4g.small"
      - "t4g.medium"
      - "t4g.large"
      - "t4g.xlarge"
      - "c6g.large"
      - "c6g.xlarge"
      - "c7g.large"
      - "c7g.xlarge"
      - "t3.small"
      - "t3.medium"
      - "t3.large"
      - "c5.xlarge"


  KeyPairName:
    Type: String
    Default: "none"
    Description: "EC2 key pair for emergency SSH access (optional - set to 'none' to skip)"

  AllowedSSHCIDR:
    Type: String
    Default: ""
    Description: "CIDR for SSH access (optional - leave empty for no inbound rules. SSM Session Manager is used for access. If SSH is needed, set to your IP/32 - find your IP at checkip.amazonaws.com)"

  CreateVPCEndpoints:
    Type: String
    Default: "true"
    Description: "Create VPC endpoints for private network access to Bedrock and SSM"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  CreateEndpoints: !Equals [!Ref CreateVPCEndpoints, "true"]
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, "none"]]
  AllowSSH: !And
    - !Not [!Equals [!Ref AllowedSSHCIDR, ""]]
    - !Not [!Equals [!Ref KeyPairName, "none"]]

Mappings:
  # Architecture detection based on instance type
  ArchitectureMap:
    t3.small: { Arch: "amd64" }
    t3.medium: { Arch: "amd64" }
    t3.large: { Arch: "amd64" }
    t3.xlarge: { Arch: "amd64" }
    c5.xlarge: { Arch: "amd64" }
    t4g.small: { Arch: "arm64" }
    t4g.medium: { Arch: "arm64" }
    t4g.large: { Arch: "arm64" }
    t4g.xlarge: { Arch: "arm64" }
    c6g.large: { Arch: "arm64" }
    c6g.xlarge: { Arch: "arm64" }
    c7g.large: { Arch: "arm64" }
    c7g.xlarge: { Arch: "arm64" }


Resources:
  # ==================== Wait Condition ====================
  OpenClawWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  OpenClawWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: InitStep7StartService
    Properties:
      Handle: !Ref OpenClawWaitHandle
      Timeout: '900'
      Count: 1

  # ==================== VPC and Network ====================
  OpenClawVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  OpenClawInternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref OpenClawVPC
      InternetGatewayId: !Ref OpenClawInternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OpenClawVPC
      CidrBlock: "10.0.1.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet"

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OpenClawVPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OpenClawVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref OpenClawInternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # VPC Endpoint Security Group
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateEndpoints
    Properties:
      GroupDescription: "Security group for VPC endpoints"
      VpcId: !Ref OpenClawVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref OpenClawSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpce-sg"

  # Bedrock Runtime VPC Endpoint (Converse API)
  BedrockRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref OpenClawVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Bedrock Mantle VPC Endpoint (OpenAI-compatible API for Project Mantle models like Kimi K2.5)
  BedrockMantleVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref OpenClawVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-mantle'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # SSM VPC Endpoint (for Session Manager)
  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref OpenClawVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  SSMMessagesVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref OpenClawVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  EC2MessagesVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref OpenClawVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # ==================== IAM Role ====================
  OpenClawInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                  - 'bedrock:ListFoundationModels'
                  - 'bedrock:GetFoundationModel'
                Resource: '*'
        - PolicyName: SSMParameterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:PutParameter'
                  - 'ssm:GetParameter'
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/openclaw/${AWS::StackName}/*'
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance-role"

  OpenClawInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref OpenClawInstanceRole

  # ==================== Security Group ====================
  OpenClawSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "OpenClaw instance security group"
      VpcId: !Ref OpenClawVPC
      SecurityGroupIngress:
        - !If
          - AllowSSH
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AllowedSSHCIDR
            Description: "SSH access (fallback)"
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ==================== SSM Init Steps ====================
  InitStep1SystemUpdate:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 180
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-1.log) 2>&1
            echo "[1/7] System update..."
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y unzip curl wget git
            echo "[1/7] Complete"

  InitStep2AwsCli:
    Type: AWS::SSM::Association
    DependsOn: InitStep1SystemUpdate
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 120
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-2.log) 2>&1
            echo "[2/7] Installing AWS CLI..."
            if command -v aws &> /dev/null; then
              echo "AWS CLI already installed"; aws --version; exit 0
            fi
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-$(arch).zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            ./aws/install
            rm -rf aws awscliv2.zip
            echo "[2/7] Complete"

  InitStep3aDocker:
    Type: AWS::SSM::Association
    DependsOn: InitStep2AwsCli
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 120
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-3a.log) 2>&1
            echo "[3a/7] Installing Docker..."
            if command -v docker &> /dev/null; then
              echo "Docker already installed"; docker --version; exit 0
            fi
            curl -fsSL https://get.docker.com | sh
            systemctl enable docker
            systemctl start docker
            usermod -aG docker ubuntu
            echo "[3a/7] Complete"

  InitStep3bNodeJs:
    Type: AWS::SSM::Association
    DependsOn: InitStep2AwsCli
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 180
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-3b.log) 2>&1
            echo "[3b/7] Installing Node.js..."
            sudo -u ubuntu bash << 'NODEEOF'
            set -e
            export HOME=/home/ubuntu
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              echo "NVM already installed"; exit 0
            fi
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm alias default 22
            NODEEOF
            echo "[3b/7] Complete"

  InitStep4OpenClaw:
    Type: AWS::SSM::Association
    DependsOn: InitStep3bNodeJs
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 180
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-4.log) 2>&1
            echo "[4/7] Installing OpenClaw..."
            sudo -u ubuntu bash << 'OCEOF'
            set -e
            export HOME=/home/ubuntu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if command -v openclaw &> /dev/null; then
              echo "OpenClaw already installed"; openclaw --version; exit 0
            fi
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ]; then
              npm install -g openclaw@latest --ignore-scripts
            else
              npm install -g openclaw@latest
            fi
            OCEOF
            # Create system-wide wrapper
            OPENCLAW_MJS=$(find /home/ubuntu/.nvm -path "*/node_modules/openclaw/openclaw.mjs" 2>/dev/null | head -1)
            NODE_BIN=$(find /home/ubuntu/.nvm -name node -type f 2>/dev/null | head -1)
            echo "#!/bin/bash" > /usr/local/bin/openclaw
            echo "exec $NODE_BIN $OPENCLAW_MJS \"\$@\"" >> /usr/local/bin/openclaw
            chmod +x /usr/local/bin/openclaw
            echo "[4/7] Complete"

  InitStep5Configure:
    Type: AWS::SSM::Association
    DependsOn: InitStep4OpenClaw
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 120
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - !Sub |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-5.log) 2>&1
            echo "[5/7] Configuring OpenClaw..."
            
            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            AWS_REGION=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
            INSTANCE_ID=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            
            sudo -u ubuntu mkdir -p /home/ubuntu/.openclaw
            GATEWAY_TOKEN=$(openssl rand -hex 24)
            
            cat > /home/ubuntu/.openclaw/openclaw.json << EOF
            {
              "gateway": {
                "mode": "local",
                "port": 18789,
                "bind": "loopback",
                "controlUi": {"enabled": true, "allowInsecureAuth": true},
                "auth": {"mode": "token", "token": "$GATEWAY_TOKEN"}
              },
              "models": {
                "providers": {
                  "amazon-bedrock": {
                    "baseUrl": "https://bedrock-runtime.$AWS_REGION.amazonaws.com",
                    "api": "bedrock-converse-stream",
                    "auth": "aws-sdk",
                    "models": [{
                      "id": "${OpenClawModel}",
                      "name": "Bedrock Model",
                      "input": ["text", "image"],
                      "contextWindow": 200000,
                      "maxTokens": 8192
                    }]
                  }
                }
              },
              "agents": {
                "defaults": {
                  "model": {"primary": "amazon-bedrock/${OpenClawModel}"}
                }
              }
            }
            EOF
            chown ubuntu:ubuntu /home/ubuntu/.openclaw/openclaw.json
            
            echo "$GATEWAY_TOKEN" > /home/ubuntu/.openclaw/gateway_token.txt
            chown ubuntu:ubuntu /home/ubuntu/.openclaw/gateway_token.txt
            
            # Save to SSM Parameter Store
            aws ssm put-parameter \
              --name "/openclaw/${AWS::StackName}/gateway-token" \
              --value "$GATEWAY_TOKEN" \
              --type "SecureString" \
              --region $AWS_REGION \
              --overwrite || true
            
            echo "[5/7] Complete"

  InitStep6EnableChannels:
    Type: AWS::SSM::Association
    DependsOn: InitStep5Configure
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 60
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-6.log) 2>&1
            echo "[6/7] Enabling messaging channels..."
            
            loginctl enable-linger ubuntu
            systemctl start user@1000.service || true
            sleep 2
            
            sudo -H -u ubuntu XDG_RUNTIME_DIR=/run/user/1000 bash -c '
            export HOME=/home/ubuntu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            openclaw plugins enable whatsapp || true
            openclaw plugins enable telegram || true
            openclaw plugins enable discord || true
            openclaw plugins enable slack || true
            openclaw plugins enable imessage || true
            '
            echo "[6/7] Complete"

  InitStep7StartService:
    Type: AWS::SSM::Association
    DependsOn: InitStep6EnableChannels
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 120
      Targets:
        - Key: InstanceIds
          Values: [!Ref OpenClawInstance]
      Parameters:
        commands:
          - !Sub |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/openclaw-init-7.log) 2>&1
            echo "[7/7] Starting OpenClaw service..."
            
            sudo -H -u ubuntu XDG_RUNTIME_DIR=/run/user/1000 bash -c '
            export HOME=/home/ubuntu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            openclaw gateway install || true
            systemctl --user start openclaw-gateway.service || openclaw gateway &
            '
            
            # Wait for gateway
            for i in $(seq 1 30); do
              if ss -tlnp | grep -q ':18789'; then
                echo "Gateway ready on port 18789"
                break
              fi
              sleep 2
            done
            
            GATEWAY_TOKEN=$(cat /home/ubuntu/.openclaw/gateway_token.txt)
            COMPLETE_URL="http://localhost:18789/?token=$GATEWAY_TOKEN"
            
            echo "SUCCESS" > /home/ubuntu/.openclaw/setup_status.txt
            echo "Setup completed: $(date)" >> /home/ubuntu/.openclaw/setup_status.txt
            
            # Signal CloudFormation
            curl -X PUT -H 'Content-Type:' --data-binary \
              "{\"Status\":\"SUCCESS\",\"Reason\":\"OpenClaw ready\",\"UniqueId\":\"openclaw\",\"Data\":\"$COMPLETE_URL\"}" \
              '${OpenClawWaitHandle}'
            
            echo "[7/7] Complete - Access URL: $COMPLETE_URL"

  # ==================== EC2 Instance ====================
  OpenClawInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub 
        - '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/${Arch}/hvm/ebs-gp3/ami-id}}'
        - Arch: !FindInMap [ArchitectureMap, !Ref InstanceType, Arch]
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref OpenClawInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref OpenClawSecurityGroup
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Minimal bootstrap - just ensure SSM agent is running
          systemctl start snap.amazon-ssm-agent.amazon-ssm-agent.service 2>/dev/null \
            || systemctl start amazon-ssm-agent 2>/dev/null || true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"

Outputs:
  Step1InstallSSMPlugin:
    Description: "STEP 1: Install SSM Session Manager Plugin on your local computer"
    Value: "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-working-with-install-plugin.html"

  Step2PortForwarding:
    Description: "STEP 2: Run this command on LOCAL computer (keep terminal open)"
    Value: !Sub |
      aws ssm start-session --target ${OpenClawInstance} --region ${AWS::Region} --document-name AWS-StartPortForwardingSession --parameters '{"portNumber":["18789"],"localPortNumber":["18789"]}'

  Step3AccessURL:
    Description: "STEP 3: Open this URL in browser"
    Value: !Select 
      - 1
      - !Split 
        - '":"'
        - !Select 
          - 0
          - !Split 
            - '"}'
            - !GetAtt OpenClawWaitCondition.Data

  Step4StartChatting:
    Description: "STEP 4: Start using OpenClaw!"
    Value: "Connect WhatsApp, Telegram, Discord. See README: https://github.com/aws-samples/sample-OpenClaw-on-AWS-with-Bedrock"

  InstanceId:
    Description: "EC2 Instance ID (for reference)"
    Value: !Ref OpenClawInstance

  BedrockModel:
    Description: "Bedrock model in use"
    Value: !Ref OpenClawModel

  MonthlyCost:
    Description: "Estimated monthly cost (USD)"
    Value: !Sub
      - |
        EC2 (${InstanceType}): ~$20-40 (Graviton instances 20% cheaper)
        EBS (30GB): ~$2.40
        VPC Endpoints: ${EndpointCost}
        Bedrock: Pay-per-use
        Total: ~${TotalCost}/month
        Note: Graviton (ARM64) instances offer better price-performance ratio
      - EndpointCost: !If [CreateEndpoints, "~$29 ($0.01/hour x 5 endpoints)", "$0"]
        TotalCost: !If [CreateEndpoints, "$45-65", "$23-43"]

  InstanceArchitecture:
    Description: "Instance architecture"
    Value: !FindInMap [ArchitectureMap, !Ref InstanceType, Arch]
